name: E2E Tests

on:
  # Reine Änderungen an Dokumenten starten die Suite nicht. Nichts davon liest die Anwendung oder ein Test;
  # docs/** baut docs.yml, das PDF der Browser-Prüfliste liegt in docs/pdf/.
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # `labeled`/`unlabeled`: das Label `e2e:alles` erzwingt die volle Suite. Jede Label-Änderung startet einen vollständigen
  # Lauf (kein übersprungener Job, der ein rotes Ergebnis überdecken könnte); `concurrency` bricht den älteren Lauf ab.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL für tests/unit/report-send-lock-postgres.test.ts (sonst übersprungen)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

      - name: Check test selection
        run: npm run check:test-selection

      - name: Check migrations against schema
        run: npm run check:migrations
        env:
          CHECK_MIGRATIONS_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres

  # Läuft parallel zu `checks`: die Gesamtzeit ist die des längeren Jobs, nicht die Summe.
  # Die volle Suite läuft in zwei Teilen (Shards), jeder mit eigenem PostgreSQL und eigener Anwendung, also ohne geteilte
  # Daten (Issue #103). Eine Auswahl von Testdateien (mode=some) ist kurz und läuft nur im Shard 1.
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    # Die Anwendung läuft direkt auf dem Runner (`next dev`), nur PostgreSQL ist ein Dienst-Container.
    # Ein zweites `npm install` in einem Container entfällt (rund 55 s je Lauf, gemessen in PR #208).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hostzero_status_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hostzero_status_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Diff gegen origin/main für die Testauswahl

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check language files
        run: npm run check:locales

      # Welche Tests laufen: s. scripts/test-selection.ts (decideSelection). Ausgaben: mode (all|some|none), lock, files.
      - name: Select tests
        id: select
        run: npm run select:e2e
        env:
          E2E_EVENT: ${{ github.event_name }}
          E2E_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}

      # Ob dieser Shard Tests ausführt: mode=all in beiden Shards, mode=some nur im Shard 1, mode=none in keinem.
      - name: Plan this shard
        id: plan
        run: |
          if [ "$E2E_MODE" = "all" ] || { [ "$E2E_MODE" = "some" ] && [ "$SHARD" = "1" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          E2E_MODE: ${{ steps.select.outputs.mode }}
          SHARD: ${{ matrix.shard }}

      - name: Install Playwright browsers
        if: steps.plan.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      # Gleiche Einstellungen wie `app` in docker-compose.test.yml (lokaler Lauf über scripts/run-e2e-tests.sh)
      - name: Start test environment
        if: steps.plan.outputs.run == 'true'
        run: |
          START=$(date +%s)
          nohup npm run dev -- --port 3001 < /dev/null 2>&1 \
            | while IFS= read -r line; do echo "$(date -u +%H:%M:%S) $line"; done > app.log &

          echo "Waiting for application to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Application is ready!"
              echo "Health check answered after $(( $(date +%s) - START )) s"
              break
            fi
            echo "Attempt $i: Waiting..."
            sleep 2
          done
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/hostzero_status_test
          PAYLOAD_SECRET: e2e-test-secret-key-32-characters
          SERVER_URL: http://localhost:3001
          PAYLOAD_PUBLIC_ALLOW_WRITES: "true"
          DEFAULT_LANGUAGE: en
          PAYLOAD_AUTO_GENERATE: "false"

      - name: Seed test data
        if: steps.plan.outputs.run == 'true'
        run: |
          API_BASE=http://localhost:3001 node tests/seed/seed-test-data.mjs

      - name: Run E2E tests
        if: steps.plan.outputs.run == 'true'
        run: |
          # Bei mode=some nur die gewählten Testdateien (eine je Zeile), sonst alle
          # Bei mode=all nur der Anteil dieses Shards
          FILES=()
          SHARD_ARG=()
          if [ "$E2E_MODE" = "some" ]; then mapfile -t FILES <<< "$E2E_FILES"; fi
          if [ "$E2E_MODE" = "all" ]; then SHARD_ARG=("--shard=$SHARD/$SHARD_TOTAL"); fi
          PLAYWRIGHT_BASE_URL=http://localhost:3001 npx playwright test --project=chromium --workers=1 --timeout=120000 "${SHARD_ARG[@]}" "${FILES[@]}"
        env:
          CI: ""  # Unset CI to allow local config options
          E2E_MODE: ${{ steps.select.outputs.mode }}
          E2E_FILES: ${{ steps.select.outputs.files }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}

      - name: Summarize test durations
        if: always() && steps.select.outcome == 'success' && steps.plan.outputs.run == 'true'
        run: node scripts/e2e-timing.mjs test-results/results.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize startup timing
        if: always() && steps.select.outcome == 'success' && steps.plan.outputs.run == 'true'
        run: |
          {
            echo "### Startup of the test environment (app log, UTC)"
            echo '```'
            grep -E "Ready in|Compiling|Pulling schema|GET /api/health 200|GET / 200" app.log | cut -c1-160 | head -40
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Der Testserver oben läuft mit offenen Schreibrechten, damit die Tests Daten anlegen können. Damit sind die
      # Routen des Admin-Bereichs ohne Anmeldung erreichbar. Die Tests „anonyme Anfrage wird mit Status 401 abgewiesen“
      # überspringen sich dort. Hier läuft der Server wie im Betrieb (PAYLOAD_PUBLIC_ALLOW_WRITES=false), nur diese
      # Tests laufen. Eigene Ausgabe und kein HTML-/JSON-Bericht, damit der Bericht des Hauptlaufs erhalten bleibt.
      - name: Check access protection (server without open writes)
        if: always() && steps.select.outputs.lock == 'true' && matrix.shard == 1
        run: |
          fuser -k -TERM 3001/tcp || true
          for i in {1..30}; do
            if ! ss -ltn | grep -q ':3001 '; then break; fi
            sleep 1
          done
          if ss -ltn | grep -q ':3001 '; then echo "Port 3001 is still in use"; exit 1; fi

          nohup npm run dev -- --port 3001 < /dev/null > app-locked.log 2>&1 &
          echo "Waiting for application to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Application is ready!"
              break
            fi
            sleep 2
          done

          PLAYWRIGHT_BASE_URL=http://localhost:3001 E2E_ACCESS_LOCKED=1 npx playwright test --project=chromium --workers=1 --timeout=120000 \
            --reporter=list --output=test-results-locked --grep "anonyme Anfrage wird mit Status 401"
        env:
          CI: ""
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/hostzero_status_test
          PAYLOAD_SECRET: e2e-test-secret-key-32-characters
          SERVER_URL: http://localhost:3001
          PAYLOAD_PUBLIC_ALLOW_WRITES: "false"
          DEFAULT_LANGUAGE: en
          PAYLOAD_AUTO_GENERATE: "false"

      - name: Upload app log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: app-log-${{ matrix.shard }}
          path: |
            app.log
            app-locked.log
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-screenshots-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
