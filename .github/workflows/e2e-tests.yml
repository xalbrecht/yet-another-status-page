name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check language files
        run: npm run check:locales

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # node_modules of the Alpine container (native packages differ from the runner), kept between runs
      - name: Cache container node_modules
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/e2e-node-modules
          key: e2e-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Build Docker image
        run: docker compose -f docker-compose.test.yml build

      - name: Start test environment
        env:
          E2E_NODE_MODULES: ${{ runner.temp }}/e2e-node-modules
        run: |
          mkdir -p "$E2E_NODE_MODULES"
          docker compose -f docker-compose.test.yml up -d
          
          # Wait for app to be healthy
          echo "Waiting for application to be ready..."
          for i in {1..60}; do
            if curl -s http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Application is ready!"
              break
            fi
            echo "Attempt $i: Waiting..."
            sleep 2
          done

      - name: Seed test data
        run: |
          API_BASE=http://localhost:3001 node tests/seed/seed-test-data.mjs

      - name: Run E2E tests
        run: |
          PLAYWRIGHT_BASE_URL=http://localhost:3001 npx playwright test --project=chromium --workers=1 --timeout=120000
        env:
          CI: ""  # Unset CI to allow local config options

      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7
