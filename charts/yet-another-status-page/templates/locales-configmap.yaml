{{- if and .Values.locales.files (not .Values.locales.existingConfigMap) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yasp.fullname" . }}-locales
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yasp.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.locales.files }}
  {{ $name | quote }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
